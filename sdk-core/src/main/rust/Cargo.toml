[package]
name = "restate-sdk-shared-core-ffm"
version = "0.1.0"
edition = "2021"

[lib]
# Native dynamic library called from Java via the Panama FFM API.
name = "restate_sdk_core"
crate-type = ["cdylib"]

[dependencies]
# Pinned to the `relay` branch, which adds the embedded relay-tunnel receiver
# behind the `tunnel` feature (the `relay_tunnel_*` C ABI below wraps it). Swap
# back to a crates.io `version = "…"` once that lands in a release.
restate-sdk-shared-core = { git = "https://github.com/restatedev/sdk-shared-core.git", branch = "relay", features = ["tracing_pretty", "tunnel"] }
bytes = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde_json = "1"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
opt-level = 3
lto = true
