name: Docker

on:    
  push:    
    branches: [main]    
    tags:    
      - v**
  workflow_dispatch:

env:
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  GHCR_REGISTRY: "ghcr.io"
  GHCR_REGISTRY_USERNAME: ${{ github.actor }}
  GHCR_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sdk-test-docker:
    if: github.repository_owner == 'restatedev'
    runs-on: warp-ubuntu-latest-x64-4x
    name: "Create test-services Docker Image (JRE ${{ matrix.jreVersion }})"
    strategy:
      fail-fast: false
      matrix:
        jreVersion: [ 17, 21, 25 ]

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          repository: restatedev/sdk-java

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache-workspaces: sdk-core/src/main/rust

      - name: Log into GitHub container registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ env.GHCR_REGISTRY_USERNAME }}
          password: ${{ env.GHCR_REGISTRY_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: |
            ghcr.io/restatedev/test-services-java
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Every tag (latest included) gets the JRE suffix, e.g. main-jre17, 2.9.4-jre21, latest-jre25,
          # otherwise the matrix jobs would overwrite each other's tags.
          flavor: |
            suffix=-jre${{ matrix.jreVersion }},onlatest=true

      - name: Build restatedev/test-services-java image (JRE ${{ matrix.jreVersion }})
        run: ./gradlew -Djib.console=plain :test-services:jibDockerBuild -PtestServicesJre=${{ matrix.jreVersion }}

      - name: Push restatedev/test-services-java image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag restatedev/test-services-java "$tag"
            docker push "$tag"
          done
